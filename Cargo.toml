[package]
name = "hy"
version = "0.18.1"
edition = "2024"
description = "HCLI - Hex-Rays CLI Utility"
license = "MIT"
repository = "https://github.com/19h/hy"
keywords = ["ida", "ida-pro", "reverse-engineering", "disassembler", "binary-analysis"]
categories = ["command-line-utilities", "development-tools"]
readme = "readme.md"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "color", "suggestions", "wrap_help", "string"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart", "blocking"], default-features = false }
futures-util = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

# HTTP framing for OAuth callbacks and KE proxies
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# TLS for explicit proxy connections
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
ryu = "1"
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"

# Error handling
thiserror = "2"

# Terminal UI
console = "0.15"
crossterm = "0.29"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
indicatif = "0.17"
owo-colors = "4"

# Crypto / hashing
sha2 = "0.10"
crc32fast = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }
# Match the datetime parser in upstream's locked pydantic-core 2.41.5.
speedate = "=0.17.0"
strum = "0.27"

# Filesystem / platform
dirs = "6"
tempfile = "3"
fs2 = "0.4"
# Lazy local-header reads preserve upstream's bundle inspection boundaries.
zip = { version = "8.6", default-features = false, features = [
    "aes-crypto", "bzip2", "deflate64", "deflate", "lzma", "time", "zstd", "xz",
] }

# Version parsing
semver = { version = "1", features = ["serde"] }

# URL parsing
url = "2"

# Regex
regex = "1"
fancy-regex = "0.16.2"

# Python-compatible integer attributes
num-bigint = "0.4"
num-traits = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
once_cell = "1"
open = "5"
encoding_rs = "0.8"
base64 = "0.22"
libc = "0.2"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
system-configuration-sys = "0.6"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
hyper = { path = "vendor/hyper" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
