[package]
name = "hy"
version = "0.18.1"
edition = "2024"
description = "HCLI - Hex-Rays CLI Utility"
license = "MIT"
repository = "https://github.com/HexRaysSA/ida-hcli"
keywords = ["ida", "ida-pro", "reverse-engineering", "disassembler", "binary-analysis"]
categories = ["command-line-utilities", "development-tools"]
readme = "readme.md"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "color", "suggestions", "wrap_help"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart", "blocking"], default-features = false }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Terminal UI
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
owo-colors = "4"

# Crypto / hashing
sha2 = "0.10"
crc32fast = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Filesystem / platform
dirs = "6"
tempfile = "3"
fs2 = "0.4"
zip = "2"

# Version parsing
semver = { version = "1", features = ["serde"] }

# URL parsing
url = "2"

# Regex
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
once_cell = "1"
open = "5"
encoding_rs = "0.8"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
