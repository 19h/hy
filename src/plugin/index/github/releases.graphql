defaultBranchRef {
  target {
    ... on Commit { oid zipballUrl committedDate }
  }
}
releases(first: $first, orderBy: {field: CREATED_AT, direction: DESC}) {
  nodes {
    name
    tagName
    createdAt
    publishedAt
    isPrerelease
    isDraft
    url
    releaseAssets(first: 50) {
      nodes { name downloadUrl size contentType }
    }
    tag {
      target {
        ... on Commit { zipballUrl oid committedDate }
        ... on Tag {
          target {
            ... on Commit { zipballUrl oid committedDate }
          }
        }
      }
    }
  }
}
refs(refPrefix: "refs/tags/", first: 25, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {
  nodes {
    name
    target {
      ... on Commit { zipballUrl oid committedDate }
      ... on Tag {
        target {
          ... on Commit { zipballUrl oid committedDate }
        }
      }
    }
  }
}
